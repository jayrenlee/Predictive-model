version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: viox_banking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceagent}
      POSTGRES_DB: ${POSTGRES_DB:-banking}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viox} -d ${POSTGRES_DB:-banking}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
